name: gawein
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  supabase_flutter: ^2.0.0
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  google_sign_in: ^6.2.1
  http: ^1.6.0
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  convex_bottom_bar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_GaweIn.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Logo_GaweIn.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/